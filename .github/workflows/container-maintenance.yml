name: Container Image Maintenance

on:
  schedule:
    - cron: '0 2 * * 3'  # Runs at 2am on Wednesdays
  workflow_dispatch:  # Enables manual triggering of the workflow

# Only run one at a time
concurrency:
  group: ${{ github.workflow }}

permissions:
  packages: write
  contents: read

jobs:
  cleanup-container-tags:
    runs-on: ubuntu-latest
    steps:
      # Replaces snok/container-retention-policy@v3.1.0 (pinned d3bdcf5):
      # the action panics on the Jan-2026 GitHub packages API response shape
      # ("Failed to fetch packages: missing field `id`", upstream issue #119,
      # closed with no fix). Same policy via gh: delete versions that are
      # untagged or tagged pr-* (incl. pr-N-amd64/pr-N-arm64) with updated_at
      # older than 2 weeks. Keeps nightly/release tags untouched.
      - name: Delete PR and untagged images older than 2 weeks
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d '14 days ago' +%s)"
          echo "Cutoff: $(date -u -d @${cutoff_epoch} --iso-8601=seconds)"
          gh api "orgs/${OWNER}/packages/container/${IMAGE}/versions" --paginate \
            --jq -r --argjson cutoff "${cutoff_epoch}" '
              .[] | select(
                ((.metadata.container.tags | length == 0)
                 or (.metadata.container.tags | any(test("^pr-"))))
                and ((.updated_at | fromdateiso8601) < $cutoff)
              ) | "\(.id)\t\(.metadata.container.tags | join(","))\t\(.updated_at)"' \
          | while IFS=$'\t' read -r vid vtags vupdated; do
              echo "Deleting version ${vid} (tags: ${vtags:-<untagged>}, updated: ${vupdated})"
              gh api -X DELETE "orgs/${OWNER}/packages/container/${IMAGE}/versions/${vid}" --silent
            done
          echo "Retention cleanup complete."

  push-container-tags:
    runs-on: ubuntu-latest
    needs: cleanup-container-tags
    if: always() # Run after cleanup even if it fails
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log into ghcr.io
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
          registry: ghcr.io/${{ github.repository_owner }}
      - name: Get list of tags
        run: |
          set -euo pipefail  # Fail pipe if any command fails
          skopeo list-tags docker://ghcr.io/${{ github.repository }} | jq --raw-output '.Tags[]' > tags
      - name: Select stable and latest release tags
        id: select
        run: |
          set -euo pipefail
          # shellcheck source=scripts/container_image_tags.sh
          source ./scripts/container_image_tags.sh

          STABLE_TAG="$(select_stable_tag tags)"
          LATEST_TAG="$(select_latest_tag tags)"

          if [[ -z "${STABLE_TAG}" || -z "${LATEST_TAG}" ]]; then
            # No semver release tags published yet (registry holds only
            # nightly/pr tags): nothing to retag. Skip cleanly instead of
            # failing the weekly maintenance run until the first release
            # is published.
            echo "NOTICE: no semver release tags in registry; skipping stable/latest retag" >&2
            echo "---- tags (head) ----" >&2
            head -n 50 tags >&2 || true
            echo "has_release_tags=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Never retag from a single-arch source (defends against broken publishes).
          assert_multiarch_ref "docker://ghcr.io/${{ github.repository }}:${STABLE_TAG}"
          assert_multiarch_ref "docker://ghcr.io/${{ github.repository }}:${LATEST_TAG}"

          echo "stable_tag=${STABLE_TAG}" >> "${GITHUB_ENV}"
          echo "latest_tag=${LATEST_TAG}" >> "${GITHUB_ENV}"
          echo "has_release_tags=true" >> "${GITHUB_OUTPUT}"
          echo "Selected stable=${STABLE_TAG} latest=${LATEST_TAG}"
      - name: Update latest and stable tags
        if: steps.select.outputs.has_release_tags == 'true'
        run: |
          set -euo pipefail
          # --all preserves the full multi-arch index. Without it, skopeo copies
          # only the runner architecture and flattens latest/stable to single-arch.
          skopeo copy --all \
            "docker://ghcr.io/${{ github.repository }}:${{ env.stable_tag }}" \
            "docker://ghcr.io/${{ github.repository }}:stable"
          skopeo copy --all \
            "docker://ghcr.io/${{ github.repository }}:${{ env.latest_tag }}" \
            "docker://ghcr.io/${{ github.repository }}:latest"
      - name: Verify latest and stable are multi-arch
        if: steps.select.outputs.has_release_tags == 'true'
        run: |
          set -euo pipefail
          # shellcheck source=scripts/container_image_tags.sh
          source ./scripts/container_image_tags.sh
          assert_multiarch_ref "docker://ghcr.io/${{ github.repository }}:stable"
          assert_multiarch_ref "docker://ghcr.io/${{ github.repository }}:latest"
